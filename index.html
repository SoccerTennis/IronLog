<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IronLog">
<title>IronLog</title>
<style>
:root{--bg:#0a0a0f;--sf:#13131f;--bd:#1e1e2e;--tx:#e8e8e8;--sb:#555;--ib:#0f0f18;--ir:#222;--acc:#ff3c00;--acc-rgb:255,60,0}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,sans-serif;min-height:100vh;display:flex;flex-direction:column;overscroll-behavior:none}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--acc);border-radius:2px}
/* FIX #7: Dashboard animation styles moved here from renderDash innerHTML to prevent duplication on every render */
@keyframes countUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.dash-num{animation:countUp 0.4s cubic-bezier(0.34,1.1,0.64,1) forwards}
.dash-card{animation:fadeUp 0.35s ease forwards;opacity:0}
.dash-card:nth-child(1){animation-delay:0s}
.dash-card:nth-child(2){animation-delay:.04s}
.dash-card:nth-child(3){animation-delay:.08s}
.dash-card:nth-child(4){animation-delay:.12s}
.dash-card:nth-child(5){animation-delay:.16s}
.dash-card:nth-child(6){animation-delay:.20s}
.dash-card:nth-child(7){animation-delay:.24s}
.shimmer-bar{background:linear-gradient(90deg,var(--acc) 0%,#e8a020 50%,var(--acc) 100%);background-size:200% 100%;animation:shimmer 1.8s linear infinite}
.iron-card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;margin-bottom:10px}
.stat-label{font-size:9px;color:var(--sb);text-transform:uppercase;letter-spacing:2px;margin-bottom:4px;font-weight:600}
.stat-val{font-size:38px;font-weight:900;color:var(--tx);line-height:1;letter-spacing:-1px}
.stat-sub{font-size:10px;color:#2a3050;margin-top:3px;font-weight:500}
.section-label{font-size:9px;color:var(--sb);text-transform:uppercase;letter-spacing:2px;margin-bottom:8px;font-weight:700}
input,select,textarea{background:var(--ib);border:1px solid var(--ir);border-radius:7px;color:var(--tx);padding:8px 10px;font-size:14px;width:100%;font-family:-apple-system,sans-serif;outline:none;-webkit-appearance:none}
input:focus,select:focus{border-color:var(--acc)}
button{font-family:-apple-system,sans-serif;cursor:pointer}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:9px;padding:12px 13px;margin-bottom:8px}
.chip{padding:5px 10px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;border:1px solid var(--bd);background:#1a1a28;color:#555;margin-right:4px;margin-bottom:5px;cursor:pointer;display:inline-block}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.ex{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:6px;font-size:13px;font-weight:600;color:var(--tx);margin-bottom:4px;background:var(--sf);border:1px solid #1a1a2a;cursor:pointer}
.ex.sel{border-color:var(--acc);background:#1a0800;color:var(--acc)}
.tag{background:var(--sf);border:1px solid #222;border-radius:4px;padding:2px 7px;font-size:10px;margin-right:3px;display:inline-block;margin-bottom:3px}
.lbl{font-size:10px;color:#555;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:5px;display:block}
.h1{font-size:16px;letter-spacing:2px;text-transform:uppercase;color:var(--acc);font-weight:800;display:block;margin-bottom:12px}
.saved{background:#00221a;border:1px solid #00c853;border-radius:6px;padding:9px;margin-bottom:9px;color:#00c853;font-weight:700;font-size:12px}
.pbtn{padding:12px;background:var(--acc);color:#fff;border:none;border-radius:7px;font-size:14px;font-weight:800;letter-spacing:1px;text-transform:uppercase;width:100%}
.pbtn:disabled{background:var(--bd);color:#555;cursor:not-allowed}
.pbtn.sm{width:auto;padding:8px 12px;font-size:12px}
.tabs{display:flex;overflow-x:auto;background:var(--sf);border-bottom:1px solid var(--bd);flex-shrink:0;-webkit-overflow-scrolling:touch}
.tabs button{padding:10px 11px;font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;background:transparent;color:var(--sb);border:none;flex-shrink:0;white-space:nowrap}
.tabs button.on{background:var(--acc);color:#fff}
.content{flex:1;padding:14px 12px;max-width:600px;width:100%;margin:0 auto;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sets-grid{display:grid;grid-template-columns:20px 1fr 1fr 60px 20px;gap:5px;align-items:center;margin-bottom:5px}
#pr-banner{position:fixed;top:0;left:0;right:0;z-index:1000;background:var(--acc);padding:12px;text-align:center;display:none;font-size:14px;font-weight:800;color:#fff;letter-spacing:2px}
.profile-bar{display:flex;background:var(--sf);border-bottom:1px solid var(--bd);padding:6px 12px;gap:8px;align-items:center;flex-shrink:0}
.prof-btn{padding:5px 14px;border-radius:20px;font-size:10px;font-weight:700;border:1px solid var(--bd);background:var(--ib);color:var(--sb);cursor:pointer}
.prof-btn.active{background:var(--acc);color:#fff;border-color:var(--acc)}
.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);z-index:500;display:flex;align-items:flex-end}
.modal{background:var(--ib);border:1px solid var(--bd);border-radius:16px 16px 0 0;width:100%;padding:20px}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fadeInBg{from{opacity:0}to{opacity:1}}
.glass-panel{animation:slideUp 0.3s cubic-bezier(0.34,1.1,0.64,1) both}
.glass-backdrop{animation:fadeInBg 0.2s ease both}
</style>
</head>
<body>
<div id="pr-banner"></div>
<div style="background:var(--sf);border-bottom:2px solid var(--acc);padding:10px 14px;display:flex;align-items:center;flex-shrink:0">
  <b style="font-size:18px;letter-spacing:3px;color:var(--acc)">⚔ IRONLOG</b>
  <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
    <b id="streak-badge" style="font-size:12px;color:var(--acc);display:none"></b>
    <span id="date-lbl" style="font-size:10px;color:#555"></span>
  </div>
</div>
<div class="profile-bar">
  <span style="font-size:10px;color:#555;text-transform:uppercase;letter-spacing:1px">Profile:</span>
  <button id="prof1-btn" class="prof-btn active" onclick="switchProfile(0)">User 1</button>
  <button id="prof2-btn" class="prof-btn" onclick="switchProfile(1)">User 2</button>
  <button onclick="showRenameModal()" style="background:none;border:none;color:#555;font-size:11px;cursor:pointer">✏️ Rename</button><button onclick="showSettingsModal()" style="background:none;border:none;color:#555;font-size:11px;margin-left:8px;cursor:pointer">⚙️ Settings</button>
</div>

<!-- Settings modal - static shell, content rendered by JS -->
<div id="settings-modal" style="display:none" class="modal-bg">
  <div class="modal" style="display:flex;flex-direction:column;max-height:88vh;padding:0;overflow:hidden">
    <div style="padding:16px 20px 12px;flex-shrink:0;border-bottom:1px solid var(--bd)">
      <b style="font-size:14px;color:var(--acc);letter-spacing:2px;text-transform:uppercase">⚙️ Settings</b>
    </div>
    <div id="settings-content" style="overflow-y:auto;flex:1;padding:16px 20px;-webkit-overflow-scrolling:touch"></div>
    <div style="padding:12px 20px 16px;flex-shrink:0;border-top:1px solid var(--bd)">
      <button class="pbtn" onclick="document.getElementById('settings-modal').style.display='none'">Done</button>
    </div>
  </div>
</div>

<div class="tabs" id="tabs"></div>
<div class="content" id="content"></div>
<div id="rename-modal" style="display:none" class="modal-bg">
  <div class="modal">
    <b style="font-size:14px;color:var(--acc);display:block;margin-bottom:14px;letter-spacing:2px;text-transform:uppercase">Rename Profiles</b>
    <div class="lbl">Profile 1 Name</div>
    <input id="name1-input" placeholder="User 1" style="margin-bottom:12px">
    <div class="lbl">Profile 2 Name</div>
    <input id="name2-input" placeholder="User 2" style="margin-bottom:16px">
    <div style="display:flex;gap:8px">
      <button class="pbtn" onclick="saveNames()" style="flex:1">Save</button>
      <button class="pbtn" onclick="document.getElementById('rename-modal').style.display='none'" style="flex:1;background:var(--bd);color:#555">Cancel</button>
    </div>
  </div>
</div>
<!-- ONBOARDING MODAL -->
<div id="onboarding-modal" style="display:none;position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,0.92);flex-direction:column;align-items:center;justify-content:center;padding:24px">
  <div style="width:100%;max-width:420px;background:var(--ib);border:1px solid var(--bd);border-radius:20px;padding:28px 22px 22px;position:relative">
    <!-- Step dots -->
    <div style="display:flex;justify-content:center;gap:7px;margin-bottom:24px" id="ob-dots"></div>
    <div id="ob-content"></div>
  </div>
</div>

<script>
const MG=["Chest","Back","Shoulders","Biceps","Triceps","Forearms","Core","Quads","Hamstrings","Glutes","Calves","Full Body","Mobility"];
const EX={
  Chest:["Bench Press","Incline Bench Press","Decline Bench Press","Dumbbell Bench Press","Incline Dumbbell Press","Push-Up","Wide Push-Up","Diamond Push-Up","Dips","Cable Fly","Incline Cable Fly","Pec Deck","Chest Press Machine","Cable Crossover","Svend Press","Landmine Press"],
  Back:["Deadlift","Romanian Deadlift","Sumo Deadlift","Trap Bar Deadlift","Pull-Up","Chin-Up","Weighted Pull-Up","Barbell Row","Pendlay Row","T-Bar Row","Dumbbell Row","Seated Cable Row","Wide Grip Cable Row","Lat Pulldown","Close Grip Lat Pulldown","Face Pull","Straight Arm Pulldown","Back Extension","Inverted Row","Rack Pull","Good Morning"],
  Shoulders:["Overhead Press","Seated Overhead Press","Dumbbell Shoulder Press","Arnold Press","Push Press","Lateral Raise","Cable Lateral Raise","Machine Lateral Raise","Front Raise","Rear Delt Fly","Rear Delt Cable Fly","Reverse Pec Deck","Upright Row","Barbell Shrugs","Dumbbell Shrugs","Face Pull","Band Pull Apart","Machine Shoulder Press"],
  Biceps:["Barbell Curl","EZ Bar Curl","Dumbbell Curl","Alternating Curl","Hammer Curl","Incline Dumbbell Curl","Concentration Curl","Preacher Curl","Cable Curl","High Cable Curl","Machine Curl","Spider Curl","Zottman Curl","21s","Cross Body Curl","Reverse Curl"],
  Triceps:["Tricep Pushdown","Rope Pushdown","Skull Crusher","EZ Bar Skull Crusher","Close Grip Bench Press","Overhead Tricep Extension","Dumbbell Overhead Extension","Dips","Bench Dips","Tricep Kickback","Cable Kickback","Single Arm Pushdown","JM Press","French Press","Cable Overhead Extension"],
  Forearms:["Wrist Curl","Reverse Wrist Curl","Hammer Curl","Reverse Curl","Farmer Carry","Dead Hang","Plate Pinch","Wrist Roller","Grip Squeezer"],
  Core:["Plank","Side Plank","Hollow Body Hold","Ab Wheel Rollout","Cable Crunch","Crunch","Bicycle Crunch","Reverse Crunch","Leg Raise","Hanging Leg Raise","Toes to Bar","Russian Twist","Dead Bug","Bird Dog","Pallof Press","Dragon Flag","V-Up","Mountain Climbers","Flutter Kicks","Sit-Up","Decline Sit-Up","Oblique Crunch","Woodchop","Suitcase Carry","Bear Crawl"],
  Quads:["Back Squat","Front Squat","Goblet Squat","Hack Squat","Leg Press","Bulgarian Split Squat","Lunge","Walking Lunge","Reverse Lunge","Step Up","Leg Extension","Wall Sit","Box Squat","Pause Squat","Sissy Squat","Zercher Squat","Pistol Squat"],
  Hamstrings:["Romanian Deadlift","Stiff Leg Deadlift","Lying Leg Curl","Seated Leg Curl","Standing Leg Curl","Nordic Curl","Good Morning","Glute Ham Raise","Single Leg RDL","Swiss Ball Leg Curl"],
  Glutes:["Hip Thrust","Barbell Hip Thrust","Glute Bridge","Single Leg Hip Thrust","Cable Kickback","Donkey Kick","Fire Hydrant","Sumo Squat","Lateral Band Walk","Clamshell","Abduction Machine","Adduction Machine","Frog Pump","Reverse Hyper"],
  Calves:["Standing Calf Raise","Seated Calf Raise","Leg Press Calf Raise","Single Leg Calf Raise","Donkey Calf Raise","Smith Machine Calf Raise","Tibialis Raise","Calf Raise on Stairs"],
  "Full Body":["Barbell Clean","Power Clean","Hang Clean","Snatch","Clean and Jerk","Kettlebell Swing","Kettlebell Clean and Press","Thruster","Burpee","Man Maker","Devil Press","Turkish Get-Up","Farmer Carry","Sled Push","Sled Pull","Battle Ropes","Box Jump","Medicine Ball Slam","Wall Ball","Tire Flip"],
  "Mobility":["Hip Flexor Stretch","Pigeon Pose","Figure Four Stretch","Hamstring Stretch","Quad Stretch","Calf Stretch","Chest Opener","Lat Stretch","Shoulder Stretch","Neck Rolls","Thoracic Rotation","Cat Cow","Child Pose","Downward Dog","Cobra Stretch","90/90 Hip Stretch","World Greatest Stretch","Ankle Circles","Wrist Circles","Foam Roll Quads","Foam Roll IT Band","Foam Roll Thoracic","Foam Roll Calves","Inchworm","Scorpion Stretch"]
};
const TIPS={
  "Bench Press":{muscles:"Chest, Front Delts, Triceps",cues:["Retract and depress your shoulder blades into the bench","Grip slightly wider than shoulder-width, wrists straight","Lower bar to lower chest with control — touch don't bounce","Drive feet into floor and press bar in a slight arc back toward rack","Keep elbows at roughly 45–75° from torso"],mistakes:["Flaring elbows out 90°","Bouncing bar off chest","Lifting hips off bench","Uneven bar path"]},
  "Incline Bench Press":{muscles:"Upper Chest, Front Delts, Triceps",cues:["Set bench to 30–45°","Bar touches upper chest, just below collarbone","Keep shoulder blades pinched throughout","Elbows slightly more tucked than flat bench","Full lockout at top without losing shoulder position"],mistakes:["Bench angle too steep — becomes a shoulder press","Letting shoulders roll forward at bottom","Partial reps"]},
  "Decline Bench Press":{muscles:"Lower Chest, Triceps",cues:["Feet secured firmly on pad","Lower bar to lower chest / upper abs","Shorter ROM than flat — don't overextend at bottom","Keep wrists neutral and elbows at 45–60°","Controlled descent, explosive press"],mistakes:["Going too heavy due to easier ROM","Head coming off pad","Bar drifting to stomach"]},
  "Dumbbell Bench Press":{muscles:"Chest, Front Delts, Triceps",cues:["Start with dumbbells on knees, kick up to chest","Neutral or slight outward grip","Lower until upper arms are parallel to floor","Press and slightly arc dumbbells together at top","Full stretch at bottom is the advantage over barbell"],mistakes:["Going too wide — strains shoulders","Not touching dumbbells at top","Uneven pressing"]},
  "Incline Dumbbell Press":{muscles:"Upper Chest, Front Delts",cues:["30–45° incline","Let dumbbells travel to sides of upper chest","Strong stretch at bottom","Press up and slightly inward","Slower eccentric for more upper chest activation"],mistakes:["Bench too steep","Elbows flaring too wide","Rushing the descent"]},
  "Push-Up":{muscles:"Chest, Triceps, Front Delts, Core",cues:["Hands slightly wider than shoulders","Body in straight line from head to heels","Lower chest to 1 inch from floor","Elbows 45° from torso, not flared","Squeeze glutes and brace core throughout"],mistakes:["Sagging hips","Head jutting forward","Partial range of motion","Elbows flared at 90°"]},
  "Wide Push-Up":{muscles:"Outer Chest, Front Delts",cues:["Hands 1.5–2x shoulder width","Elbows flare more than standard push-up","Chest leads the descent","Keep core rigid","Slower tempo maximises stretch"],mistakes:["Hands too wide — strains wrists","Hips sagging","Not achieving full chest contact with floor level"]},
  "Diamond Push-Up":{muscles:"Triceps, Inner Chest",cues:["Form a diamond shape with thumbs and index fingers","Elbows track back close to ribs","Lower chest to hands","Full lockout at top","Brace core — body stays straight"],mistakes:["Hips sagging","Elbows flaring out","Wrists cocked — keep neutral"]},
  "Dips":{muscles:"Chest (leaning forward) or Triceps (upright), Front Delts",cues:["For chest: lean torso forward 30°, let elbows flare slightly","For triceps: stay upright, elbows close to body","Lower until upper arms parallel to floor","Full lockout at top","Control the descent"],mistakes:["Going too deep with shoulder issues","Kipping / using momentum","Shrugging shoulders up to ears"]},
  "Cable Fly":{muscles:"Chest (mid)",cues:["Set cables at chest height","Slight bend in elbows — maintain throughout","Arc arms together like hugging a tree","Squeeze chest hard at the centre","Slow return — feel the stretch"],mistakes:["Bending elbows too much — becomes a press","Using momentum to swing cables","Not pausing at peak contraction"]},
  "Incline Cable Fly":{muscles:"Upper Chest",cues:["Set cables low, pull upward and inward","Lean back slightly on incline bench","Keep elbows soft and consistent","Squeeze at top — cables should cross slightly","Emphasise the stretch at bottom"],mistakes:["Cables too high — reduces upper chest stimulus","Straightening arms under load","Rushing eccentric"]},
  "Pec Deck":{muscles:"Chest (inner and mid)",cues:["Seat height so arms are parallel to floor","Press forearms into pads, not just hands","Bring pads together and squeeze 1 second","Controlled return — don't let weight slam","Keep back flat against pad"],mistakes:["Elbows too low","Overextending at the back — strains shoulders","Bouncing weight stack"]},
  "Chest Press Machine":{muscles:"Chest, Triceps, Front Delts",cues:["Adjust seat so handles align with mid chest","Drive through heels for stability","Full extension without locking elbows aggressively","Squeeze chest at lockout","Slow negative — 2–3 seconds down"],mistakes:["Seat too high or low","Partial reps","Letting shoulders round forward"]},
  "Cable Crossover":{muscles:"Chest (all fibres depending on angle)",cues:["Set cables high for lower chest, low for upper","Step forward for stability, slight forward lean","Maintain elbow bend — don't pull with biceps","Cross hands slightly at bottom/top","Squeeze and hold 1 second at peak"],mistakes:["Arms too straight — risks elbow strain","Standing too upright","No pause at contraction"]},
  "Svend Press":{muscles:"Inner Chest",cues:["Hold two plates together at chest height","Press straight out while squeezing plates together","Pause at full extension","Bring back slowly to chest — maintain plate pressure","Light weight — this is isolation"],mistakes:["Going too heavy","Letting plates separate","Dropping elbows below chest level"]},
  "Landmine Press":{muscles:"Upper Chest, Front Delts, Triceps",cues:["One or two hands on end of barbell in landmine","Press at 45° angle upward and forward","Keep core braced — slight forward lean","Full extension then controlled return","Unilateral version great for shoulder health"],mistakes:["Bar drifting sideways","Losing core tightness","Overextending at top"]},
  "Deadlift":{muscles:"Hamstrings, Glutes, Lower Back, Traps, Lats",cues:["Bar over mid-foot, hip-width stance","Hinge to grip — push floor away, don't pull bar up","Lats tight — 'protect your armpits'","Hips and shoulders rise at same rate off floor","Lock out by squeezing glutes, not hyperextending back"],mistakes:["Bar drifting away from body","Rounding lower back","Jerking the bar off the floor","Hyperextending at lockout"]},
  "Romanian Deadlift":{muscles:"Hamstrings, Glutes, Lower Back",cues:["Soft knee bend — maintain throughout","Hinge at hips, pushing them back","Bar stays close to legs — shins and thighs","Feel the stretch in hamstrings at bottom","Drive hips forward to stand — squeeze glutes"],mistakes:["Rounding lower back","Bending knees too much — becomes a squat","Bar drifting forward"]},
  "Sumo Deadlift":{muscles:"Glutes, Inner Thighs, Hamstrings, Back",cues:["Wide stance, toes pointed out 30–45°","Grip inside legs, arms straight down","Push knees out over toes throughout","Same hip-shoulder rise rate as conventional","Shorter torso angle — more quad and glute involvement"],mistakes:["Knees caving in","Too narrow grip","Stance too wide to achieve hip hinge"]},

  "Dumbbell Row":{muscles:"Lats, Rhomboids, Rear Delts, Biceps",cues:["Brace on bench — back flat and parallel","Pull dumbbell to hip, not armpit","Elbow drives straight back","Full stretch at bottom — slight shoulder protraction","Don't rotate torso"],mistakes:["Rotating hips and torso","Pulling to armpit — hits rear delt more than lat","Partial range"]},

  "Wide Grip Cable Row":{muscles:"Upper Lats, Rear Delts",cues:["Wide bar attachment","Pull to upper chest / neck","Elbows flare out more than standard row","Retract scapula hard at peak","Slow negative"],mistakes:["Leaning back","Not retracting shoulder blades","Too heavy — compromises form"]},

  "Face Pull":{muscles:"Rear Delts, External Rotators, Traps",cues:["Set cable at face height","Grip rope with thumbs up","Pull to face — hands go to ears","Flare elbows high and wide","External rotate at end — 'show your biceps'"],mistakes:["Elbows dropping","Pulling to neck instead of face","Using too much weight — ruins form"]},
  "Straight Arm Pulldown":{muscles:"Lats (long head isolation)",cues:["Stand back from cable, slight forward lean","Keep arms straight — minimal elbow bend","Pull bar from overhead to hips in an arc","Squeeze lats hard at bottom","Slow return — resist the cable"],mistakes:["Bending elbows — becomes a pulldown","Standing too close","Not feeling lats — reduce weight"]},

const THEME_KEYS=Object.keys(THEMES);

let currentTheme=localStorage.getItem("il_theme")||"original";
const SHUFFLE_MODE="shuffle";

function applyTheme(key){
  let resolvedKey=key;
  if(key===SHUFFLE_MODE){
    const last=localStorage.getItem("il_last_theme")||"original";
    const others=THEME_KEYS.filter(function(k){return k!==last;});
    resolvedKey=others[Math.floor(Math.random()*others.length)];
    localStorage.setItem("il_theme",SHUFFLE_MODE);
    localStorage.setItem("il_last_theme",resolvedKey);
  } else {
    localStorage.setItem("il_theme",key);
    localStorage.setItem("il_last_theme",key);
  }
  const t=THEMES[resolvedKey]||THEMES.original;
  const r=document.documentElement.style;
  r.setProperty("--bg",t.bg);
  r.setProperty("--sf",t.sf);
  r.setProperty("--bd",t.bd);
  r.setProperty("--acc",t.acc);
  r.setProperty("--tx",t.tx);
  r.setProperty("--sb",t.sb);
  r.setProperty("--ib",t.ib);
  r.setProperty("--ir",t.ir);
  r.setProperty("--acc-rgb",t.accRgb);
  currentTheme=key;
  document.querySelectorAll("[data-acc]").forEach(function(el){el.style.color=t.acc;});
}

function isTimeBased(ex){if(!ex)return false;const n=ex.toLowerCase();return TIME_BASED.some(t=>t.toLowerCase()===n)||n.includes("hold")||n.includes("carry")||n.includes("hang")||n.includes("static")||n.includes("iso");}
// FIX #3: Sort by date descending so we always get the most recent session's first set
function getLastLogged(ex){const past=D().wos.filter(w=>w.exercise===ex&&w.sets&&w.sets.length).sort((a,b)=>new Date(b.date)-new Date(a.date));if(!past.length)return null;const s=past[0].sets[0];if(!s)return null;return s;}
// context = "log" (default) or "qa" — determines which EA toggle function is called
function renderSetsTable(sets,picker,tb,last,context){
  context=context||"log";
  const ghostR=last&&last.r?last.r:"";
  const ghostW=last&&last.w?last.w:"";
  const ghostT=last&&last.t?last.t:"";
  const cols=tb?"20px 1fr 44px 20px":"20px 1fr 1fr 1fr 44px 20px";
  const hdrs=tb?["#","Time(s)","EA","●"]:["#","Reps","Wt (lbs)","Time(s)","EA","●"];
  const lastHint=last?(" — last: "+(ghostR?ghostR+"r ":"")+(ghostW?"@"+ghostW+" ":"")+(ghostT?ghostT+"s":"")).trim():"";
  let html="";
  html+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">';
  html+='<span style="font-size:10px;color:#555;text-transform:uppercase;letter-spacing:1px">Sets';
  if(lastHint)html+=' <span style="font-size:9px;color:#333;text-transform:none;letter-spacing:0;font-weight:400">'+lastHint+'</span>';
  html+='</span>';
  html+='<div style="display:flex;gap:5px">';
  html+='<button onclick="showRestTimer()" style="padding:3px 9px;background:none;border:1px solid var(--bd);border-radius:5px;font-size:11px;color:#555;cursor:pointer" title="Rest timer">⏱</button>';
  if(sets.length>0)html+='<button onclick="addSame()" style="padding:3px 9px;background:rgba(var(--acc-rgb),0.1);color:var(--acc);border:1px solid rgba(var(--acc-rgb),0.3);border-radius:5px;font-size:11px;font-weight:700;cursor:pointer">+ Same</button>';
  html+='<button onclick="addSet()" style="padding:3px 10px;background:var(--acc);color:#fff;border:none;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer">+ Set</button>';
  html+='</div></div>';
  html+='<div style="background:var(--sf);border:1px solid var(--bd);border-radius:9px;overflow:hidden;margin-bottom:10px">';
  // Header row
  html+='<div style="display:grid;grid-template-columns:'+cols+';gap:0;padding:6px 8px;border-bottom:1px solid #111">';
  hdrs.forEach(function(h,hi){
    if(h==="●")h="";
    if(h==="EA"){
      html+='<div style="font-size:7px;color:#444;text-transform:uppercase;text-align:center;display:flex;align-items:center;justify-content:center;gap:3px">EA<span onclick="showEATip()" style="cursor:pointer;font-size:8px;color:#2a2a2a;border:1px solid #222;border-radius:50%;width:12px;height:12px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0">i</span></div>';
    } else {
      html+='<div style="font-size:7px;color:#444;text-transform:uppercase;text-align:center">'+h+'</div>';
    }
  });
  html+='</div>';
  // Data rows
  sets.forEach(function(s,i){
    const rActive=picker.show&&picker.setIdx===i&&picker.field==="r";
    const wActive=picker.show&&picker.setIdx===i&&picker.field==="w";
    const tActive=picker.show&&picker.setIdx===i&&picker.field==="t";
    html+='<div style="display:grid;grid-template-columns:'+cols+';gap:3px;padding:5px 8px;border-bottom:1px solid var(--bg);align-items:center">';
    html+='<div style="font-size:10px;color:#555;text-align:center;font-weight:700">'+(i+1)+'</div>';
    if(!tb){
      const rVal=s.r?s.r:(ghostR?'<span style="color:#2a2a3a">'+ghostR+'</span>':"—");
      html+='<div onclick="openPicker('+i+',"r")" style="cursor:pointer;border-radius:5px;padding:6px 2px;font-size:13px;text-align:center;background:var(--sf);border:1px solid '+(rActive?"var(--acc)":"#1a1a1a")+';color:'+(s.r?"var(--tx)":"#444")+';min-height:32px;display:flex;align-items:center;justify-content:center">'+rVal+'</div>';
      const wVal=s.w?s.w+(s.ea?" EA":""):(ghostW?'<span style="color:#2a2a3a">@'+ghostW+'</span>':"—");
      html+='<div onclick="openPicker('+i+',"w")" style="cursor:pointer;border-radius:5px;padding:6px 2px;font-size:13px;text-align:center;background:var(--sf);border:1px solid '+(wActive?"var(--acc)":"#1a1a1a")+';color:'+(s.w?"var(--tx)":"#444")+';min-height:32px;display:flex;align-items:center;justify-content:center">'+wVal+'</div>';
    }
    const tVal=s.t?s.t+"s":(ghostT&&tb?'<span style="color:#2a2a3a">'+ghostT+'s</span>':"—");
    html+='<div onclick="openPicker('+i+',"t")" style="cursor:pointer;border-radius:5px;padding:6px 2px;font-size:13px;text-align:center;background:var(--sf);border:1px solid '+(tActive?"var(--acc)":"#1a1a1a")+';color:'+(s.t?"var(--tx)":"#444")+';min-height:32px;display:flex;align-items:center;justify-content:center">'+tVal+'</div>';
    html+='<button onclick="'+(context==="qa"?"toggleQAEA":"toggleEA")+'('+i+')" title="'+(s.ea?"Each Arm — weight shown is per arm":"Total — weight shown is combined")+'" style="padding:3px 2px;border-radius:5px;font-size:9px;font-weight:800;border:1px solid '+(s.ea?"var(--acc)":"#1a1a1a")+';background:'+(s.ea?"rgba(var(--acc-rgb),0.2)":"#111")+';color:'+(s.ea?"var(--acc)":"#444")+';cursor:pointer;text-align:center;transition:background 0.15s,border-color 0.15s">'+(s.ea?"EA":"TOT")+'</button>';
    html+='<button onclick="remSet('+i+')" style="background:none;border:none;color:#333;font-size:13px;padding:0;cursor:pointer;text-align:center">✕</button>';
    html+='</div>';
  });
  html+='</div>';
  return html;
}

function openPicker(idx,field){
  glPicker={show:true,setIdx:idx,field:field,value:field==="r"?logState.sets[idx].r:field==="w"?logState.sets[idx].w:logState.sets[idx].t||""};
  renderLog(document.getElementById("content"));
}
function closePicker(){glPicker={show:false,setIdx:-1,field:"",value:""};renderLog(document.getElementById("content"));}
function pickValue(idx,field,val){
  if(field==="r")logState.sets[idx].r=String(val);
  else if(field==="w")logState.sets[idx].w=String(val);
  else logState.sets[idx].t=String(val);
  glPicker={show:false,setIdx:-1,field:"",value:""};
  renderLog(document.getElementById("content"));
}
function toggleEA(idx){logState.sets[idx].ea=!logState.sets[idx].ea;renderLog(document.getElementById("content"));}
function toggleQAEA(idx){if(quickAdd.sets[idx])quickAdd.sets[idx].ea=!quickAdd.sets[idx].ea;renderQuickAdd();}
function openPlanPicker(idx,field){
  const ex=planBuilder.exercises[idx];
  const val=field==="sets"?ex.sets:field==="reps"?ex.reps:field==="time"?ex.time||"":ex.weight||"";
  planPicker={show:true,exIdx:idx,field:field,value:val};
  renderTools(document.getElementById("content"));

function saveWo(){

  const sets=logState.sets.filter(s=>s.r||s.w||s.t);
  const woDate=logState.date===tk()?new Date().toISOString():new Date(logState.date+"T12:00:00").toISOString();D().wos.unshift({id:String(Date.now()),date:woDate,muscle:logState.muscle,exercise:logState.exercise,sets});
  const mw=Math.max(...logState.sets.map(s=>s.w==="BW"?0:parseFloat(s.w)||0));
  const allBW=logState.sets.every(s=>s.w==="BW"||!s.w);
  if(mw>0){const cur=D().prs[logState.exercise]?.weight||0;if(mw>cur){showPR(logState.exercise);const bestSet=logState.sets.reduce((a,s)=>(parseFloat(s.w)||0)>(parseFloat(a.w)||0)?s:a,logState.sets[0]);D().prs[logState.exercise]={weight:mw,unit:bestSet?.u||"lbs",date:new Date().toISOString(),muscle:logState.muscle,ea:bestSet?.ea||false};}}
  else if(allBW){
    // BW exercise — track highest rep set as the PR
    const maxReps=Math.max(...logState.sets.map(s=>parseInt(s.r)||0));
    if(maxReps>0){const curReps=D().prs[logState.exercise]?.reps||0;if(maxReps>curReps){showPR(logState.exercise);D().prs[logState.exercise]={reps:maxReps,weight:0,unit:"reps",date:new Date().toISOString(),muscle:logState.muscle,bw:true};}}
  }
  if(logState.planQueue&&logState.planQueue.length){
    const next=logState.planQueue.shift();
    logState.exercise=typeof next==="string"?next:(next.name||next);
    const nSets=typeof next==="object"&&next.sets?next.sets:logState.planSets||3;
    const nReps=typeof next==="object"&&next.reps?next.reps:logState.planReps||"10";
    const nWt=typeof next==="object"&&next.weight?next.weight:"";
    const nEa=typeof next==="object"&&next.ea?true:false;
    logState.sets=Array.from({length:nSets},function(){return{r:nReps,w:nWt,u:"lbs",t:"",ea:nEa};});
    // Keep the back-date throughout the whole queue — don't reset to today
  } else {

  }

function setHF(f){histState.hf=f;renderHistory(document.getElementById("content"));}
function deleteWo(id){
  if(!window.confirm("Delete this workout?"))return;
  D().wos=D().wos.filter(x=>String(x.id)!==String(id));
  save();
  if(tab==="History")renderHistory(document.getElementById("content"));
  else renderDash(document.getElementById("content"));
}
function deletePlanSession(sessionId){
  if(!window.confirm("Delete entire plan session?"))return;
  D().wos=D().wos.filter(x=>String(x.sessionId)!==String(sessionId));
  invalidateStreak();save();
  renderHistory(document.getElementById("content"));
}
function relogPlan(sessionId){
  const exs=D().wos.filter(x=>String(x.sessionId)===String(sessionId));
  if(!exs.length)return;
  // Queue all exercises from the session into Weights
  const sorted=[...exs].reverse();
  logState.muscle=sorted[0].muscle;
  logState.exercise=sorted[0].exercise;
  logState.sets=sorted[0].sets.map(s=>({...s,r:s.r,w:s.w,u:s.u||"lbs",t:s.t||"",ea:s.ea||false}));
  logState.planQueue=sorted.slice(1).map(e=>({name:e.exercise,muscle:e.muscle,sets:e.sets.length,reps:e.sets[0]?.r||"10",weight:e.sets[0]?.w||"",ea:e.sets[0]?.ea||false}));
  logState.date=tk();
  setTab("Weights");
}

// PRs
function getBest1RM(ex){
  let best=0;
  D().wos.filter(w=>w.exercise===ex).forEach(w=>{
    w.sets.forEach(s=>{
      if(s.w&&s.r){const orm=calcORM(s.w,s.r);if(orm>best)best=orm;}
    });
  });
  return best;
}
function renderPRs(el){
  el.innerHTML=`<b class="h1">Personal Records 🏆</b>
  ${!Object.keys(D().prs).length?`<div style="color:#555;text-align:center;padding:24px 0;font-size:13px">No PRs yet — start logging!</div>`
  :MG.map(m=>{const ent=Object.entries(D().prs).filter(([,p])=>p.muscle===m);if(!ent.length)return"";
    return`<div style="font-size:9px;font-weight:700;text-transform:uppercase;color:#555;margin-bottom:4px;margin-top:10px">${m}</div>
    ${ent.sort((a,b)=>(b[1].bw?0:b[1].weight)-(a[1].bw?0:a[1].weight)).map(([ex,p])=>`
    <div class="card" style="border:1px solid rgba(var(--acc-rgb),0.2);display:flex;justify-content:space-between;align-items:center">
      <div>
        <b style="font-size:13px">${ex}</b>
        <div style="font-size:10px;color:#555">${fd(p.date)}${p.ea?" · <span style='color:var(--acc);font-weight:700'>EA</span>":""}${p.bw?" · <span style='color:#888'>Bodyweight</span>":""}</div>
      </div>
      <div style="text-align:right">
        ${p.bw
          ?`<b style="font-size:19px;color:var(--acc)">${p.reps}<span style="font-size:10px"> reps</span></b>`
          :`<b style="font-size:19px;color:var(--acc)">${p.weight}<span style="font-size:10px"> ${p.unit}</span></b>${getBest1RM(ex)>p.weight?`<div style="font-size:9px;color:#555;margin-top:1px">Est. 1RM: <b style="color:var(--acc)">${getBest1RM(ex)} ${p.unit}</b></div>`:""}`
        }
      </div>
    </div>`).join("")}`;
  }).join("")}`;
}

// CARDIO
let cardioState={type:"Running",dist:"",du:"mi",h:"",m:"",s:"",course:"",date:tk(),saved:false,notes:"",showIntervals:false,intervals:[],hiitWork:"40",hiitRest:"20",hiitRounds:"8",hiitName:"",tennisScore:"",tennisSurface:"Hard",tennisType:"Match",hiitPreset:"",runType:"Easy",showSplits:false,splits:[]};

function addInterval(){cardioState.intervals.push({speed:"",dur:"",unit:"min"});renderCardio(document.getElementById("content"));}
function removeInterval(i){cardioState.intervals.splice(i,1);renderCardio(document.getElementById("content"));}
function toggleIntervals(){cardioState.showIntervals=!cardioState.showIntervals;renderCardio(document.getElementById("content"));}
function toggleSplits(){
  cardioState.showSplits=!cardioState.showSplits;
  if(cardioState.showSplits){
    // Build splits array based on distance
    const dist=parseFloat(cardioState.dist)||0;
    if(dist>0){
      const full=Math.floor(dist);const rem=Math.round((dist-full)*100)/100;
      const rows=full+(rem>0?1:0);
      // Keep existing splits, only add/remove rows as needed
      while(cardioState.splits.length<rows)cardioState.splits.push({m:"",s:""});
      cardioState.splits=cardioState.splits.slice(0,rows);
    } else {

  const filledSplits=cardioState.splits.filter(s=>s.m||s.s);
  let pace=null;
  if(filledSplits.length>=2){
    const totalSplitSecs=filledSplits.reduce((a,s)=>a+(parseInt(s.m)||0)*60+(parseInt(s.s)||0),0);
    pace=((totalSplitSecs/60)/filledSplits.length).toFixed(2);
  } else if(cardioState.dist&&ts&&!isSportSave){
    pace=((ts/60)/parseFloat(cardioState.dist)).toFixed(2);
  }
  const splitsToSave=cardioState.splits.filter(s=>s.m||s.s).map(s=>({m:s.m,s:s.s}));
  D().cl.unshift({id:String(Date.now()),date:cardioState.date,type:cardioState.type,dist:isSportSave?"":cardioState.dist,notes:cardioState.notes,intervals:cardioState.intervals,splits:splitsToSave,hiitWork:cardioState.hiitWork,hiitRest:cardioState.hiitRest,hiitRounds:cardioState.hiitRounds,hiitName:cardioState.hiitName,hiitPreset:cardioState.hiitPreset,tennisScore:cardioState.tennisScore,tennisSurface:cardioState.tennisSurface,tennisType:cardioState.tennisType,runType:cardioState.runType,du:cardioState.du,h:cardioState.h,m:cardioState.m,s:cardioState.s,ts,pace,course:cardioState.course});
  if(cardioState.notes){
    if(!profiles[activeProfile].journal)profiles[activeProfile].journal={};
    const jk=cardioState.date;
    const existing=profiles[activeProfile].journal[jk]||"";
    const prefix=cardioState.type+" note: ";
    profiles[activeProfile].journal[jk]=existing?(existing+"\n"+prefix+cardioState.notes):(prefix+cardioState.notes);
  }
  cardioState.dist="";cardioState.h="";cardioState.m="";cardioState.s="";cardioState.course="";cardioState.notes="";cardioState.intervals=[];cardioState.showIntervals=false;cardioState.splits=[];cardioState.showSplits=false;cardioState.date=tk();cardioState.saved=true;cardioState.tennisScore="";cardioState.hiitName="";cardioState.hiitPreset="";cardioState.tennisType="Match";cardioState.runType="Easy";
  save();renderCardio(document.getElementById("content"));
  setTimeout(()=>{cardioState.saved=false;renderCardio(document.getElementById("content"));},2500);
}
function deleteCardio(id,fromHistory){

function addProtein(){const v=parseInt(document.getElementById("prot-input")?.value)||0;if(!v)return;D().pr[tk()]=(D().pr[tk()]||0)+v;save();renderProtein(document.getElementById("content"));}
function resetProtein(){if(!confirm("Reset today's protein?"))return;D().pr[tk()]=0;save();renderProtein(document.getElementById("content"));}

function clearMeal(meal){
  if(!confirm("Clear all items from "+meal+"?"))return;
  if(!D().meals||!D().meals[tk()])return;
  // FIX #5: Read items BEFORE zeroing so protein subtraction is correct
  const items=(D().meals[tk()][meal])||[];
  const prot=items.reduce(function(a,f){return a+(parseInt(f.protein)||0);},0);
  if(prot>0)D().pr[tk()]=Math.max(0,(D().pr[tk()]||0)-prot);
  profiles[activeProfile].meals[tk()][meal]=[];
  save();renderProtein(document.getElementById("content"));
}

function addMealItem(meal){
  const nameEl=document.getElementById("food-"+meal);
  const protEl=document.getElementById("prot-"+meal);
  const name=(nameEl?.value||"").trim();
  if(!name)return;
  const protein=protEl?.value||"";
  if(!profiles[activeProfile].meals)profiles[activeProfile].meals={};
  if(!D().meals[tk()])profiles[activeProfile].meals[tk()]={breakfast:[],lunch:[],dinner:[],snacks:[]};
  D().meals[tk()][meal].push({name,protein});
  // Also add protein to daily total if specified
  if(protein)D().pr[tk()]=(D().pr[tk()]||0)+(parseInt(protein)||0);
  save();renderProtein(document.getElementById("content"));
}

let mealEdit={active:false,meal:"",idx:-1,name:"",protein:""};
function editMealItem(meal,idx){
  const item=D().meals&&D().meals[tk()]&&D().meals[tk()][meal]?D().meals[tk()][meal][idx]:null;
  if(!item)return;
  mealEdit={active:true,meal,idx,name:item.name,protein:item.protein||""};
  renderProtein(document.getElementById("content"));
}
function saveMealEdit(){
  const item=D().meals[tk()][mealEdit.meal][mealEdit.idx];
  // Read directly from DOM inputs — mealEdit.name/protein were never wired to input listeners
  const newName=document.getElementById("edit-name")?.value||mealEdit.name||item.name;
  const newProt=document.getElementById("edit-prot")?.value||mealEdit.protein||"";
  const oldProt=parseInt(item.protein)||0;
  const nProt=parseInt(newProt)||0;
  D().pr[tk()]=Math.max(0,(D().pr[tk()]||0)-oldProt+nProt);
  D().meals[tk()][mealEdit.meal][mealEdit.idx]={name:newName,protein:newProt};
  mealEdit={active:false,meal:"",idx:-1,name:"",protein:""};
  save();renderProtein(document.getElementById("content"));
}
function cancelMealEdit(){mealEdit={active:false,meal:"",idx:-1,name:"",protein:""};renderProtein(document.getElementById("content"));}

function removeMealItem(meal,idx){if(!confirm("Remove this item?"))return;
  if(!D().meals[tk()])return;
  const item=D().meals[tk()][meal][idx];
  // Remove protein from total
  if(item?.protein)D().pr[tk()]=Math.max(0,(D().pr[tk()]||0)-(parseInt(item.protein)||0));
  D().meals[tk()][meal].splice(idx,1);
  save();renderProtein(document.getElementById("content"));
}

function getWeeklySummary(){
  const now=new Date();
  const weekStart=(()=>{const d=new Date();const day=d.getDay();d.setDate(d.getDate()-(day===0?6:day-1));d.setHours(0,0,0,0);return d;})();
  const lastWeekStart=new Date(weekStart);lastWeekStart.setDate(lastWeekStart.getDate()-7);
  const thisWeek=D().wos.filter(w=>new Date(w.date)>=weekStart);
  const lastWeek=D().wos.filter(w=>{const d=new Date(w.date);return d>=lastWeekStart&&d<weekStart;});
  const vol=ws=>ws.reduce((a,w)=>a+w.sets.reduce((b,s)=>b+(parseFloat(s.w)||0)*(parseFloat(s.r)||0),0),0);
  const sets=ws=>ws.reduce((a,w)=>a+w.sets.length,0);
  const reps=ws=>ws.reduce((a,w)=>a+w.sets.reduce((b,s)=>b+(parseFloat(s.r)||0),0),0);
  return{
    thisVol:vol(thisWeek),lastVol:vol(lastWeek),
    thisSets:sets(thisWeek),lastSets:sets(lastWeek),
    thisReps:reps(thisWeek),lastReps:reps(lastWeek),
    thisWos:thisWeek.length,lastWos:lastWeek.length
  };
}

function getVolumeByMuscle(){
  const result={};
  D().wos.forEach(w=>{
    const v=w.sets.reduce((b,s)=>b+(parseFloat(s.w)||0)*(parseFloat(s.r)||0),0);
    result[w.muscle]=(result[w.muscle]||0)+v;
  });
  return Object.entries(result).sort((a,b)=>b[1]-a[1]).slice(0,6);
}

function calcORM(weight, reps){
  if(!weight||!reps||reps===1)return weight;
  return Math.round(parseFloat(weight)*(1+parseFloat(reps)/30));
}

function calcPlates(target, barWeight){
  const bar=parseFloat(barWeight)||45;
  const plates=[45,35,25,10,5,2.5];
  let remaining=(parseFloat(target)-bar)/2;
  const result=[];
  plates.forEach(p=>{const count=Math.floor(remaining/p);if(count>0){result.push({p,count});remaining-=count*p;}});
  return{result,remaining:Math.round(remaining*10)/10};
}

function calcPlateDisplay(){
  const target=parseFloat(document.getElementById("plate-target")?.value)||0;
  const bar=parseFloat(document.getElementById("plate-bar")?.value)||45;
  const result=document.getElementById("plate-result");
  if(!result)return;
  if(!target){result.innerHTML="";return;}
  if(target<bar){result.innerHTML=`<div style="color:var(--acc);font-size:12px">Target must be more than bar weight (${bar} lbs)</div>`;return;}
  const{result:plates,remaining}=calcPlates(target,bar);
  if(plates.length===0&&remaining===0){result.innerHTML=`<div style="font-size:12px;color:#555">Just the bar (${bar} lbs)</div>`;return;}
  result.innerHTML=`
    <div style="background:var(--sf);border-radius:7px;padding:10px 12px">
      <div style="font-size:10px;color:#555;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px">Each side:</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">
        ${plates.map(({p,count})=>`<div style="background:var(--bd);border:1px solid var(--acc);border-radius:6px;padding:6px 10px;text-align:center"><b style="font-size:16px;color:var(--acc);display:block">${p}</b><div style="font-size:9px;color:#555">×${count}</div></div>`).join("")}
      </div>
      ${remaining>0?`<div style="font-size:10px;color:var(--acc)">⚠️ ${remaining} lbs unaccounted — no exact plate combo</div>`:""}
      <div style="font-size:11px;color:#555;margin-top:6px">Bar: ${bar} lbs · Total: ${target} lbs</div>
    </div>`;
}

function buildBalanceChart(){
  const balMG=["Chest","Back","Shoulders","Biceps","Triceps","Quads","Hamstrings","Glutes","Calves","Core"];

  // Strength standards (lbs) by level: [beginner, intermediate, advanced]
  // Based on general lifting standards for avg bodyweight ~170lbs
  const standards={
    Chest:[95,185,275],Back:[115,205,320],Shoulders:[55,105,165],
    Biceps:[45,85,130],Triceps:[55,100,155],Quads:[115,205,315],
    Hamstrings:[85,155,240],Glutes:[95,175,275],Calves:[55,100,155],Core:[0,0,0]
  };

  const prW=balMG.map(function(m){
    const ent=Object.entries(D().prs).filter(function(e){return e[1].muscle===m;});
    if(!ent.length)return 0;
    return Math.max.apply(null,ent.map(function(e){return e[1].weight||0;}));
  });

  // Get 1RM estimates for each muscle
  const orm1RM=balMG.map(function(m){
    let best=0;
    D().wos.filter(function(w){return w.muscle===m;}).forEach(function(w){
      w.sets.forEach(function(s){if(s.w&&s.r){const v=calcORM(s.w,s.r);if(v>best)best=v;}});
    });
    return best;
  });

  const effectiveW=balMG.map(function(m,i){return Math.max(prW[i],orm1RM[i]);});
  const maxW=Math.max.apply(null,effectiveW.concat([1]));
  const norm=effectiveW.map(function(w){return w/maxW;});
  const hasData=effectiveW.some(function(w){return w>0;});

  if(!hasData)return'<div style="color:#555;text-align:center;padding:20px 0;font-size:12px">Log workouts to see your strength balance</div>';

  // Determine level for each muscle
  function getLevel(m,w){
    const s=standards[m];if(!s||!w)return null;
    if(w>=s[2])return{l:"Advanced",c:"#00c853",n:3};
    if(w>=s[1])return{l:"Intermediate",c:"#ffa000",n:2};
    if(w>=s[0])return{l:"Beginner",c:"var(--acc)",n:1};
    return{l:"Developing",c:"#333",n:0};
  }

  // Find imbalances
  const pairs=[["Chest","Back"],["Biceps","Triceps"],["Quads","Hamstrings"]];
  const imbalances=[];
  pairs.forEach(function(pair){
    const a=effectiveW[balMG.indexOf(pair[0])];
    const b=effectiveW[balMG.indexOf(pair[1])];
    if(a>0&&b>0){
      const ratio=Math.min(a,b)/Math.max(a,b);
      if(ratio<0.7){
        const weak=a<b?pair[0]:pair[1];
        const strong=a>b?pair[0]:pair[1];
        imbalances.push({weak,strong,ratio:Math.round(ratio*100)});
      }
    }
  });

  // Recommended exercises per weak muscle
  const recs={
    Chest:["Bench Press","Cable Fly","Push-Up"],
    Back:["Deadlift","Barbell Row","Pull-Up"],
    Shoulders:["Overhead Press","Lateral Raise","Face Pull"],
    Biceps:["Barbell Curl","Hammer Curl","Preacher Curl"],
    Triceps:["Skull Crusher","Pushdown","Close Grip Bench"],
    Quads:["Back Squat","Leg Press","Bulgarian Split Squat"],
    Hamstrings:["Romanian Deadlift","Leg Curl","Nordic Curl"],
    Glutes:["Hip Thrust","Glute Bridge","Cable Kickback"],
    Calves:["Standing Calf Raise","Seated Calf Raise"],
    Core:["Plank","Hanging Leg Raise","Ab Wheel Rollout"]
  };

  // SVG radar chart
  const n=balMG.length;
  const cx=115,cy=115,r=80;
  function angle(i){return(i/n)*Math.PI*2-Math.PI/2;}
  function sc(v,m){const lv=getLevel(m,v*maxW);return lv?lv.c:"#333";}
  function gridPts(lv){return balMG.map(function(_,i){return(cx+r*lv*Math.cos(angle(i)))+","+(cy+r*lv*Math.sin(angle(i)));}).join(" ");}
  const dataPts=norm.map(function(v,i){return{x:cx+r*v*Math.cos(angle(i)),y:cy+r*v*Math.sin(angle(i))};});
  const lblPts=balMG.map(function(_,i){return{x:cx+(r+22)*Math.cos(angle(i)),y:cy+(r+22)*Math.sin(angle(i)),l:balMG[i],v:effectiveW[i],n:norm[i]};});

  let svg='<div style="display:flex;justify-content:center;margin-bottom:12px"><svg width="230" height="230" viewBox="0 0 230 230">';
  [0.25,0.5,0.75,1].forEach(function(lv){svg+='<polygon points="'+gridPts(lv)+'" fill="none" stroke="var(--bd)" stroke-width="1"/>';});
  // Level rings labels
  svg+='<text x="'+(cx+r*0.25*Math.cos(-Math.PI/2)+4)+'" y="'+(cy+r*0.25*Math.sin(-Math.PI/2))+'" font-size="6" fill="#333">25%</text>';
  svg+='<text x="'+(cx+r*0.5*Math.cos(-Math.PI/2)+4)+'" y="'+(cy+r*0.5*Math.sin(-Math.PI/2))+'" font-size="6" fill="#333">50%</text>';
  svg+='<text x="'+(cx+r*0.75*Math.cos(-Math.PI/2)+4)+'" y="'+(cy+r*0.75*Math.sin(-Math.PI/2))+'" font-size="6" fill="#333">75%</text>';
  balMG.forEach(function(_,i){svg+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+r*Math.cos(angle(i)))+'" y2="'+(cy+r*Math.sin(angle(i)))+'" stroke="#1a1a1a" stroke-width="1"/>';});
  svg+='<polygon points="'+dataPts.map(function(p){return p.x+","+p.y;}).join(" ")+'" fill="rgba(255,60,0,0.12)" stroke="var(--acc)" stroke-width="1.5"/>';
  dataPts.forEach(function(p,i){svg+='<circle cx="'+p.x+'" cy="'+p.y+'" r="4" fill="'+sc(norm[i],balMG[i])+'"/>';});
  lblPts.forEach(function(p){
    const lv=getLevel(p.l,p.v);
    const col=p.v>0?(lv?lv.c:'#888'):'#2a2a3a';
    const fw=p.v>0?700:400;
    svg+='<text x="'+p.x+'" y="'+(p.y-5)+'" text-anchor="middle" dominant-baseline="middle" font-size="8.5" fill="'+col+'" font-family="-apple-system,sans-serif" font-weight="'+fw+'">'+p.l+'</text>';
    if(p.v>0)svg+='<text x="'+p.x+'" y="'+(p.y+7)+'" text-anchor="middle" dominant-baseline="middle" font-size="7" fill="'+col+'" font-family="-apple-system,sans-serif" opacity="0.7">'+Math.round(p.v)+'lbs</text>';
  });
  svg+='</svg></div>';

  // Muscle breakdown table
  let table='<div style="margin-bottom:12px">';
  balMG.forEach(function(m,i){
    if(!effectiveW[i])return;
    const lv=getLevel(m,effectiveW[i]);
    const s=standards[m];
    const nextTarget=s&&lv&&lv.n<3?s[lv.n]:null;
    table+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">';
    table+='<div style="width:72px;font-size:10px;color:#888;flex-shrink:0">'+m+'</div>';
    table+='<div style="flex:1;height:8px;background:var(--sf);border-radius:4px;overflow:hidden"><div style="height:100%;border-radius:4px;background:'+(lv?lv.c:'#333')+';width:'+Math.round(norm[i]*100)+'%;transition:width .5s"></div></div>';
    table+='<div style="font-size:10px;font-weight:700;color:'+(lv?lv.c:'#555')+';width:44px;text-align:right">'+effectiveW[i]+'lbs</div>';
    table+='<div style="font-size:9px;color:'+(lv?lv.c:'#555')+';width:72px;text-align:right">'+(lv?lv.l:'')+'</div>';
    table+='</div>';
    if(nextTarget)table+='<div style="font-size:9px;color:#333;margin-left:80px;margin-top:-5px;margin-bottom:6px">Next level: '+nextTarget+'lbs</div>';
  });
  table+='</div>';

  // Imbalance alerts
  let alerts='';
  if(imbalances.length){
    alerts='<div style="background:rgba(var(--acc-rgb),0.05);border:1px solid rgba(var(--acc-rgb),0.2);border-radius:8px;padding:10px 12px;margin-bottom:12px">';
    alerts+='<div style="font-size:10px;color:var(--acc);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">⚠️ Imbalances Detected</div>';
    imbalances.forEach(function(imp){
      alerts+='<div style="font-size:12px;color:#ccc;margin-bottom:5px">Your <b style="color:var(--acc)">'+imp.weak+'</b> is '+imp.ratio+'% of your <b>'+imp.strong+'</b> strength — consider prioritizing '+imp.weak+' work</div>';
    });
    alerts+='</div>';
  }

  // Recommended exercises for weakest muscles
  const weakMuscles=balMG.map(function(m,i){return{m,v:norm[i]};}).filter(function(x){return x.v>0&&x.v<0.6;}).sort(function(a,b){return a.v-b.v;}).slice(0,3);
  let recsHTML='';
  if(weakMuscles.length){
    recsHTML='<div style="margin-bottom:8px"><div style="font-size:10px;color:#555;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">Recommended Focus</div>';
    weakMuscles.forEach(function(wm){
      const exs=recs[wm.m]||[];
      recsHTML+='<div style="margin-bottom:8px"><div style="font-size:11px;color:#ffa000;font-weight:700;margin-bottom:4px">'+wm.m+' ('+Math.round(wm.v*100)+'%)</div>';
      recsHTML+='<div>'+exs.map(function(e){return'<span class="tag" style="font-size:9px">'+e+'</span>';}).join('')+'</div></div>';
    });
    recsHTML+='</div>';
  }

  // Legend
  const legend='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">'
    +'<div style="display:flex;align-items:center;gap:3px"><div style="width:7px;height:7px;border-radius:50%;background:#00c853"></div><span style="font-size:8px;color:#555">Advanced</span></div>'
    +'<div style="display:flex;align-items:center;gap:3px"><div style="width:7px;height:7px;border-radius:50%;background:#ffa000"></div><span style="font-size:8px;color:#555">Intermediate</span></div>'
    +'<div style="display:flex;align-items:center;gap:3px"><div style="width:7px;height:7px;border-radius:50%;background:var(--acc)"></div><span style="font-size:8px;color:#555">Beginner</span></div>'
    +'<div style="display:flex;align-items:center;gap:3px"><div style="width:7px;height:7px;border-radius:50%;background:#333"></div><span style="font-size:8px;color:#555">Developing</span></div>'
    +'</div>';

  return svg+table+alerts+recsHTML+legend;
}




function clearHistoryOnly(){
  if(!confirm("Clear all workout and cardio history for "+profileNames[activeProfile]+"?\n\nThis cannot be undone. PRs, food data, and settings are kept."))return;
  profiles[activeProfile].wos=[];
  profiles[activeProfile].cl=[];
  profiles[activeProfile].rd=[];
  invalidateStreak();
  save();
  document.getElementById("settings-modal").style.display="none";
  renderContent();
  const msg=document.createElement("div");msg.className="saved";msg.style.cssText="position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:2000;white-space:nowrap;padding:10px 18px;border-radius:8px";msg.textContent="✅ History cleared";document.body.appendChild(msg);setTimeout(function(){msg.remove();},2500);
}

function exportAllData(){
  const data={profiles:profiles,profileNames:profileNames,exportDate:new Date().toISOString(),version:"IronLog"};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download="ironlog-data-"+tk()+".json";a.click();
  // FIX #17: Defer revoke so it doesn't race the browser's download trigger
  setTimeout(function(){URL.revokeObjectURL(url);},5000);
}

function showSettingsModal(){
  document.getElementById("settings-modal").style.display="flex";
  renderSettingsContent();
}

function renderSettingsContent(){

    html+='<button onclick="setBicep('+i+')" style="font-size:26px;padding:8px 10px;border-radius:8px;border:2px solid '+(curBicep===i?'var(--acc)':'var(--bd)')+';background:'+(curBicep===i?'rgba(var(--acc-rgb),0.1)':'var(--sf)')+';">'+e+'</button>';

  html+='<div class="lbl">Default Bar Weight</div>';
  html+='<div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">';

  });

  Object.keys(THEMES).forEach(function(key){
    const t=THEMES[key];
    const active=currentTheme===key;
    html+='<button onclick="applyTheme(\''+key+'\');renderSettingsContent();renderContent()" style="border-radius:12px;padding:0;border:2px solid '+(active?t.acc:'rgba(255,255,255,0.07)')+';background:'+t.bg+';cursor:pointer;text-align:left;overflow:hidden;transition:border 0.2s">';

    html+='<div style="height:28px;background:'+t.sf+';position:relative;display:flex;align-items:center;padding:0 10px;gap:6px">';
    html+='<div style="width:10px;height:10px;border-radius:50%;background:'+t.acc+';flex-shrink:0;box-shadow:0 0 8px '+t.acc+'99"></div>';
    html+='<span style="font-size:9px;font-weight:800;color:'+t.acc+';letter-spacing:0.5px;text-transform:uppercase">'+t.name+'</span>';
    if(active)html+='<span style="font-size:10px;color:'+t.acc+';margin-left:auto;font-weight:800">✓</span>';
    html+='</div>';
    // Preview bars
    html+='<div style="padding:7px 10px 9px;display:flex;flex-direction:column;gap:4px">';
    // Simulated card
    html+='<div style="border-radius:5px;padding:5px 7px;background:'+t.sf+';border:1px solid '+t.bd+'">';
    html+='<div style="font-size:8px;color:'+t.sb+';margin-bottom:2px">STREAK</div>';
    html+='<div style="font-size:14px;font-weight:900;color:'+t.acc+'">7 days</div>';
    html+='</div>';
    // Simulated button
    html+='<div style="border-radius:5px;padding:4px 7px;background:'+t.acc+';text-align:center">';
    html+='<span style="font-size:8px;font-weight:800;color:'+t.bg+'">SAVE</span>';
    html+='</div>';
    html+='</div>';
    html+='</button>';
  });
  // Shuffle card
  const shuffleActive=currentTheme===SHUFFLE_MODE;
  const lastApplied=localStorage.getItem("il_last_theme")||"original";
  const lastT=THEMES[lastApplied]||THEMES.original;
  html+='<button onclick="applyTheme(\'shuffle\');renderSettingsContent();renderContent()" style="border-radius:12px;padding:0;border:2px solid '+(shuffleActive?'#aaa':'rgba(255,255,255,0.07)')+';background:#0a0a0a;cursor:pointer;text-align:left;overflow:hidden;transition:border 0.2s;grid-column:1/-1">';
  html+='<div style="height:28px;background:#111;position:relative;display:flex;align-items:center;padding:0 10px;gap:6px">';
  html+='<div style="display:flex;gap:3px">';
  THEME_KEYS.forEach(function(k){html+='<div style="width:8px;height:8px;border-radius:50%;background:'+THEMES[k].acc+'"></div>';});
  html+='</div>';
  html+='<span style="font-size:9px;font-weight:800;color:#ccc;letter-spacing:0.5px;text-transform:uppercase;margin-left:4px">🎲 Shuffle — new theme every open</span>';
  if(shuffleActive)html+='<span style="font-size:10px;color:#aaa;margin-left:auto;font-weight:800">✓ Using '+lastT.name+'</span>';
  html+='</div>';
  html+='<div style="padding:6px 10px 8px;display:flex;gap:4px;align-items:center">';
  THEME_KEYS.forEach(function(k){
    const t=THEMES[k];
    html+='<div style="flex:1;border-radius:4px;padding:4px 3px;background:'+t.sf+';border:1px solid '+t.bd+';text-align:center">';
    html+='<div style="font-size:10px;font-weight:900;color:'+t.acc+'">7</div>';
    html+='</div>';
  });
  html+='</div>';
  html+='</button>';
  html+='</div>';
  html+='<div class="lbl">Data</div>';
  html+='<button onclick="exportAllData()" style="width:100%;padding:9px;background:none;border:1px solid rgba(var(--acc-rgb),0.4);border-radius:7px;color:var(--acc);font-size:12px;font-weight:700;cursor:pointer">⬇ Export All Data (JSON)</button>';
  html+='<button onclick="clearHistoryOnly()" style="width:100%;margin-top:8px;padding:9px;background:none;border:1px solid rgba(248,113,113,0.4);border-radius:7px;color:#f87171;font-size:12px;font-weight:700;cursor:pointer">🗑 Clear Workout History</button>';
  html+='<div style="font-size:10px;color:#555;margin-top:5px;margin-bottom:8px">Removes all logged workouts and cardio for this profile. Keeps PRs, food data, and settings.</div>';
  html+='<button onclick="localStorage.removeItem(\'il_onboarded\');document.getElementById(\'settings-modal\').style.display=\'none\';obStep=0;showOnboarding()" style="width:100%;padding:9px;background:none;border:1px solid var(--bd);border-radius:7px;color:#555;font-size:11px;cursor:pointer">↺ Replay Setup Screens</button>';
  document.getElementById("settings-content").innerHTML=html;
}

function setBicep(idx){
  profiles[activeProfile].bicep=idx;
  save();
  showSettingsModal();
  updateStreak();
}

function setDefaultBar(w){
  profiles[activeProfile].defaultBar=w;
  save();
  showSettingsModal();
}

function renderContent(){
  const el=document.getElementById("content");
  if(tab==="Dashboard")renderDash(el);
  else if(tab==="Weights")renderLog(el);
  else if(tab==="History")renderHistory(el);
  else if(tab==="PRs")renderPRs(el);
  else if(tab==="Cardio")renderCardio(el);
  else if(tab==="Food")renderProtein(el);
  else if(tab==="Progress")renderProgress(el);
  else if(tab==="My Plans")renderTools(el);
  updateStreak();
}

// ── ONBOARDING ──────────────────────────────────────────────
let obStep=0;
const OB_KEY="il_onboarded";
function showOnboarding(){
  document.getElementById("onboarding-modal").style.display="flex";
  renderObStep();
}
function renderObStep(){
  const dots=document.getElementById("ob-dots");
  dots.innerHTML=[0,1,2].map(i=>`<div style="width:${obStep===i?18:6}px;height:6px;border-radius:3px;background:${obStep===i?"var(--acc)":"var(--bd)"};transition:width 0.2s"></div>`).join("");
  const el=document.getElementById("ob-content");
  if(obStep===0){
    el.innerHTML=`
      <div style="font-size:28px;font-weight:900;color:var(--acc);letter-spacing:2px;margin-bottom:6px">⚔ IRONLOG</div>
      <div style="font-size:13px;color:var(--sb);margin-bottom:22px;line-height:1.5">Your training log. Let's set you up — takes 30 seconds.</div>
      <div style="font-size:10px;color:#555;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">Your name</div>
      <input id="ob-name1" placeholder="Player 1" style="margin-bottom:10px">
      <div style="font-size:10px;color:#555;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">Friend's name <span style="color:#2a2a3a">(optional)</span></div>
      <input id="ob-name2" placeholder="Player 2" style="margin-bottom:22px">
      <button onclick="obNext()" class="pbtn">Next →</button>`;
  } else if(obStep===1){
    el.innerHTML=`
      <div style="font-size:18px;font-weight:800;color:var(--tx);margin-bottom:6px">🥦 Daily Protein Goal</div>
      <div style="font-size:12px;color:var(--sb);margin-bottom:20px;line-height:1.5">How many grams of protein do you aim for each day? A common target is 0.7–1g per lb of bodyweight.</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
        ${[100,120,150,180,200].map(g=>`<button onclick="document.getElementById('ob-pg').value=${g};document.querySelectorAll('.ob-pg-chip').forEach(b=>b.style.background='var(--sf)');this.style.background='rgba(var(--acc-rgb),0.2)'" class="ob-pg-chip" style="padding:8px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);font-size:13px;font-weight:700;cursor:pointer">${g}g</button>`).join("")}
      </div>
      <input type="number" id="ob-pg" placeholder="Custom (g)" style="margin-bottom:22px">
      <div style="display:flex;gap:8px">
        <button onclick="obStep=0;renderObStep()" style="flex:1;padding:12px;background:none;border:1px solid var(--bd);border-radius:7px;color:#555;font-size:13px;cursor:pointer">← Back</button>
        <button onclick="obNext()" class="pbtn" style="flex:2">Next →</button>
      </div>`;
  } else {
    el.innerHTML=`
      <div style="font-size:18px;font-weight:800;color:var(--tx);margin-bottom:6px">🎨 Pick a theme</div>
      <div style="font-size:12px;color:var(--sb);margin-bottom:16px">You can change this any time in Settings.</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:22px">
        ${Object.keys(THEMES).map(key=>{const t=THEMES[key];return`<button onclick="applyTheme('${key}');document.querySelectorAll('.ob-theme-btn').forEach(b=>b.style.borderColor='rgba(255,255,255,0.07)');this.style.borderColor='${t.acc}'" class="ob-theme-btn" style="border-radius:10px;padding:10px 12px;border:2px solid rgba(255,255,255,0.07);background:${t.bg};cursor:pointer;text-align:left;transition:border 0.15s">
          <div style="display:flex;align-items:center;gap:7px">
            <div style="width:10px;height:10px;border-radius:50%;background:${t.acc};box-shadow:0 0 6px ${t.acc}88"></div>
            <span style="font-size:11px;font-weight:700;color:${t.tx}">${t.name}</span>
          </div>
        </button>`;}).join("")}
      </div>
      <div style="display:flex;gap:8px">
        <button onclick="obStep=1;renderObStep()" style="flex:1;padding:12px;background:none;border:1px solid var(--bd);border-radius:7px;color:#555;font-size:13px;cursor:pointer">← Back</button>
        <button onclick="obFinish()" class="pbtn" style="flex:2">Let's go ${bicep()}</button>
      </div>`;
  }
}
function obNext(){
  if(obStep===0){
    const n1=(document.getElementById("ob-name1")?.value||"").trim();
    const n2=(document.getElementById("ob-name2")?.value||"").trim();
    if(n1)profileNames[0]=n1;
    if(n2)profileNames[1]=n2;
    updateProfileBar();
  } else if(obStep===1){
    const pg=document.getElementById("ob-pg")?.value;
    if(pg&&parseInt(pg)>0){profiles[0].pg=pg;profiles[1].pg=pg;}
  }
  obStep++;renderObStep();
}
function obFinish(){
  localStorage.setItem(OB_KEY,"1");
  save();
  document.getElementById("onboarding-modal").style.display="none";
  renderContent();
}

// ── LEVELS ──────────────────────────────────────────────────
function getLevel(wos){
  const n=wos||0;
  if(n>=100)return{label:"Legend",color:"#ffd700"};
  if(n>=50)return{label:"Beast",color:"#ff4444"};
  if(n>=25)return{label:"Grind",color:"#ff8800"};
  if(n>=10)return{label:"Iron",color:"#7eb8f7"};
  return{label:"Rookie",color:"#555"};
}

// ── RECENT EXERCISES ────────────────────────────────────────
function getRecentExercises(limit){
  const seen=new Set();const result=[];
  const sorted=[...D().wos].sort((a,b)=>new Date(b.date)-new Date(a.date));
  for(const w of sorted){if(!seen.has(w.exercise)){seen.add(w.exercise);result.push(w.exercise);if(result.length>=limit)break;}}
  return result;
}

renderTabs();
renderContent();
// Show onboarding on first ever open
if(!localStorage.getItem(OB_KEY)){showOnboarding();}
